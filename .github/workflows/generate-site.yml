name: Generate World Cup Site

on:
  push:
    branches:
      - main
    paths:
      - 'PythonApplication1/teams.csv'
      - 'PythonApplication1/players.csv'
      - 'PythonApplication1/PythonApplication1.py'

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install pandas
      
      - name: Run generator script
        working-directory: PythonApplication1
        run: python PythonApplication1.py
      
      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add site/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update World Cup site [auto]" && git push)
